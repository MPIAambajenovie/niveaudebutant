<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'inscription électeur </title>
   
</head>
<body >
  <hr>
  <h1> <center><u>FORMULAIRE D'INSCRIPTION ELECTEUR  </u> </center> <br/></h1>
<hr/> 
   
     <form
action="mailto:votre adresse-email@exemple.com"method="post"
enctype="text/plain">
  
     <label for="nom">Nom :</label>
     <input type="text"id="nom"name="nom"
     placeholder="  Inserez votre Nom"
     required><br><br>
     <label for="postnom">Post-nom:</label>
     <input type="text"id="post-nom"name="post-nom"
     placeholder="  Inserez votre post-nom"
     required><br><br>
     <label for="prenom">Prenom :</label>
     <input type="text"id="prenom"name="prenom"
     placeholder="  Inserez votre Prenom"
     required><br><br>
     <label for="dete de naissance">Date de naissance  :</label>
     <input type="text"id="date de naissance"name="date de naissance"
     placeholder="  Inserez votre date de naissance"
     required><br><br>
     <label for="adresse">Adresse:</label>
     <input type="text"id="adresse"name="adresse"
     placeholder="  Inserez votre adresse"
     required><br><br>
     <label for="email">Email :</label>
     <input type="text"id="email"name="email"
     placeholder="  Inserez votre-adresse-email"
     required><br><br>
     <label for="ville">ville :</label>
     <input type="text"id="ville"name="ville"
      placeholder="  Inserez votre ville"
     required><br><br>
     <label for="origine">origine :</label>
     <input type="text"id="origine"name="origine"
     placeholder="Inserez votre origine"
     required><br><br>
     <label for="nom du pere">Nom du Père:</label>
     <input type="text"id="nom du pere"name="nom du pere"
     placeholder="Inserez le nom de votre Père"
     required><br><br>
     <label for="nom de la mere ">Nom de la Mère :</label>
     <input type="text"id="nom de la mere"name="nom de la mere"
     placeholder="Inserez le nom de votre Mère"
     required><br><br>
     <label for="numéro">Numéro  :</label>
     <input type="text"id="numéro"name="numéro"
     placeholder="Inserez votre numéro d'électeur "
     required><br><br>
     
     <input type="submit" value="s'inscrire">
        <input type="reset" value="Effacer"
     
     </form>

</body>
</html>
